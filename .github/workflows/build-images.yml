name: Build & Push Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clustervision-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clustervision-frontend

jobs:
  # ── Lint: fast checks before any Docker build ────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Ruff check (backend)
        run: ruff check backend/

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: TypeScript type check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Backend tests: unit suite (SQLite) + a real Alembic migration smoke
  # test (Postgres) — the latter is what would have caught the "upgrading an
  # already-existing pre-Alembic schema needs a stamp first" failure mode.
  test-backend:
    name: Backend tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the Allure report to gh-pages
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clustervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Unit test suite (SQLite, no external services)
        id: unit_tests
        # continue-on-error: a red suite must still produce an Allure report to
        # look at — the explicit "Fail job on test failure" step below is what
        # actually gates build-backend, not this step's own conclusion.
        continue-on-error: true
        run: python -m pytest tests/ -v --alluredir=allure-results
        working-directory: backend
        env:
          CV_JWT_SECRET: ci-unit-test-secret-not-for-production
          DATABASE_URL: "sqlite:///:memory:"

      - name: Alembic migration smoke test (real Postgres)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
        working-directory: backend
        env:
          CV_JWT_SECRET: ci-migration-test-secret-not-for-production
          DATABASE_URL: "postgresql+psycopg://postgres:test@localhost:5432/clustervision"

      # ── Allure report: publish to gh-pages, with trend history across runs ──
      - name: Get previous Allure history
        if: always()
        continue-on-error: true  # first-ever run: gh-pages doesn't exist yet
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: backend/allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      # simple-elf/allure-report-action runs as root in a Docker container and
      # leaves a root-owned .git dir inside allure-history/ (copied along with
      # the gh-pages history it merges). peaceiris/actions-gh-pages can't
      # delete it (permission denied) before initializing its own orphan repo,
      # so it silently copies this stale .git over the fresh one — the commit
      # then lands on the wrong branch and the push fails with "src refspec
      # gh-pages does not match any". Strip it ourselves first.
      - name: Strip embedded git metadata from Allure history output
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" allure-history
          rm -rf allure-history/.git

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # Sidesteps "Remote branch gh-pages not found" on the very first
          # deploy (this action tries to track the existing remote branch
          # otherwise). Safe here — the actual trend history across runs is
          # already merged at the file level by simple-elf/allure-report-action
          # above, so there's nothing lost by not keeping this branch's own
          # git history.
          force_orphan: true

      - name: Fail job on test failure
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit test suite failed — see the Allure report for details." >&2
          exit 1

  # ── Backend: build per platform on native runners, then merge ───────────────
  build-backend:
    name: Backend (${{ matrix.platform }})
    needs: [lint, test-backend]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests/backend
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/backend/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/backend/*
          retention-days: 1

  merge-backend:
    name: Backend manifest merge
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/backend
          pattern: backend-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push multi-platform manifest
        working-directory: /tmp/digests/backend
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.BACKEND_IMAGE }}@sha256:%s ' *)

  # ── Frontend: build per platform on native runners, then merge ──────────────
  build-frontend:
    name: Frontend (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push frontend (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
          outputs: type=image,name=${{ env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests/frontend
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/frontend/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/frontend/*
          retention-days: 1

  merge-frontend:
    name: Frontend manifest merge
    needs: build-frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/frontend
          pattern: frontend-digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push multi-platform manifest
        working-directory: /tmp/digests/frontend
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FRONTEND_IMAGE }}@sha256:%s ' *)

  # ── Summary ──────────────────────────────────────────────────────────────────
  summary:
    name: Build summary
    needs: [merge-backend, merge-frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions: {}
    steps:
      - name: Write summary
        run: |
          echo "## Images published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Platforms |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.BACKEND_IMAGE }}\` | linux/amd64, linux/arm64 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.FRONTEND_IMAGE }}\` | linux/amd64, linux/arm64 |" >> "$GITHUB_STEP_SUMMARY"
