# Global image settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/j4rj4r/clustervision-backend
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  env:
    clusterName: "kubernetes"
    clusterApiUrl: ""        # Auto-detected in-cluster if empty
    # corsOrigins: restrict to your frontend host, e.g. https://clustervision.example.com
    # Leave empty to deny all cross-origin requests (nginx Ingress handles routing)
    corsOrigins: []
    # publicUrl: canonical URL used in bootstrap scripts (prevents Host header injection)
    # e.g. https://clustervision.example.com — auto-detected from request if empty
    publicUrl: ""

    # Required PostgreSQL database — all ClusterVision application state lives
    # here (local login accounts, managed user registry, token history,
    # cluster registry, Vault runtime config, access requests). Native
    # Kubernetes objects the app manages (RBAC objects, CSRs, ServiceAccount
    # token Secrets) are unaffected and stay in Kubernetes.
    # Priority: existingSecret > url — one of the two is required.
    database:
      url: ""              # e.g. postgresql+psycopg://user:pass@host:5432/clustervision
      existingSecret: ""    # name of an existing Secret containing the URL
      existingSecretKey: "database-url"

    auth:
      # JWT signing secret.
      # Priority: existingSecret > value > auto-generated (persisted via lookup).
      # Auto-generation is stable across helm upgrade — the value is kept in the
      # managed Secret and reused on subsequent upgrades.
      jwtSecret:
        value: ""             # inline value — Helm creates a managed Secret
        existingSecret: ""    # name of a pre-existing K8s Secret
        existingSecretKey: "jwt-secret"

      # Initial admin account — bootstrapped on first deploy when no CV users exist.
      # Priority: existingSecret > value > skipped (no bootstrap).
      adminPassword:
        value: ""             # inline value — Helm creates a managed Secret
        existingSecret: ""    # name of a pre-existing K8s Secret
        existingSecretKey: "admin-password"

      # Set to "false" when serving over plain HTTP (development only).
      secureCookie: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Revokes JIT access-request bindings past their expiry — runs across the
  # local cluster and every registered remote cluster.
  jitCleanup:
    enabled: true
    schedule: "*/5 * * * *"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  service:
    type: ClusterIP
    port: 8000

frontend:
  image:
    repository: ghcr.io/j4rj4r/clustervision-frontend
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: traefik
  host: clustervision.local
  annotations: {}
  tls: []
  # tls:
  #   - secretName: clustervision-tls
  #     hosts:
  #       - clustervision.local

serviceAccount:
  create: true
  name: clustervision-backend

rbac:
  create: true

networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik  # adjust to your Ingress controller namespace

# Vault integration (optional)
# Can also be configured at runtime via Settings → Integrations (no restart needed).
vault:
  enabled: false
  addr: ""           # e.g. https://vault.example.com
  token: ""          # creates a managed Secret; use existingSecret to reference an existing one
  existingSecret: "" # name of an existing Secret containing the Vault token
  existingSecretKey: "token"
  mount: "secret"
  basePath: "clustervision/users"
  namespace: ""      # Vault Enterprise namespace (leave empty for OSS)
  tlsSkipVerify: false # skip TLS certificate verification (self-signed Vault)
