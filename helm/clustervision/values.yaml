# Global image settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/j4rj4r/clustervision-backend
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  env:
    clusterName: "kubernetes"
    clusterApiUrl: ""        # Auto-detected in-cluster if empty
    registryNamespace: "clustervision"
    # corsOrigins: restrict to your frontend host, e.g. https://clustervision.example.com
    # Leave empty to deny all cross-origin requests (nginx Ingress handles routing)
    corsOrigins: []
    # publicUrl: canonical URL used in bootstrap scripts (prevents Host header injection)
    # e.g. https://clustervision.example.com — auto-detected from request if empty
    publicUrl: ""

    auth:
      # JWT signing secret — strongly recommended in production.
      # Reference an existing K8s Secret containing CV_JWT_SECRET.
      # If omitted, a random secret is generated at each pod startup
      # (all sessions are invalidated on restart).
      jwtSecret:
        secretName: ""       # e.g. clustervision-jwt
        secretKey: "jwt-secret"

      # Initial admin account — only applied on first deployment when no users exist.
      # Create a K8s Secret beforehand:
      #   kubectl create secret generic clustervision-admin --from-literal=admin-password=<pass>
      adminPassword:
        secretName: ""       # e.g. clustervision-admin
        secretKey: "admin-password"

      # Set to "false" when serving over plain HTTP (development only).
      secureCookie: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 8000

frontend:
  image:
    repository: ghcr.io/j4rj4r/clustervision-frontend
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: traefik
  host: clustervision.local
  annotations: {}
  tls: []
  # tls:
  #   - secretName: clustervision-tls
  #     hosts:
  #       - clustervision.local

serviceAccount:
  create: true
  name: clustervision-backend

rbac:
  create: true

networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik  # adjust to your Ingress controller namespace
