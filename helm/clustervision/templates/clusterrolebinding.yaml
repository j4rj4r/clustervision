{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clustervision.fullname" . }}-manager
  labels:
    {{- include "clustervision.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clustervision.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "clustervision.serviceAccountName" . }}
    namespace: {{ include "clustervision.namespace" . }}
{{- end }}
