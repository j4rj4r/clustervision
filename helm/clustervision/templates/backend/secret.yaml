{{- $auth := .Values.backend.env.auth -}}

{{/* ── JWT Secret ─────────────────────────────────────────────────────────── */}}
{{- if not $auth.jwtSecret.existingSecret }}
{{- $secretName := printf "%s-jwt" (include "clustervision.fullname" .) -}}
{{- $existing   := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $jwtValue   := "" -}}
{{- if $auth.jwtSecret.value -}}
  {{- $jwtValue = $auth.jwtSecret.value -}}
{{- else if $existing -}}
  {{- $jwtValue = index $existing.data "jwt-secret" | b64dec -}}
{{- else -}}
  {{- $jwtValue = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "clustervision.namespace" . }}
  labels:
    {{- include "clustervision.labels" . | nindent 4 }}
stringData:
  jwt-secret: {{ $jwtValue | quote }}
{{- end }}

{{/* ── Admin Password Secret ────────────────────────────────────────────── */}}
{{- if and $auth.adminPassword.value (not $auth.adminPassword.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin" (include "clustervision.fullname" .) }}
  namespace: {{ include "clustervision.namespace" . }}
  labels:
    {{- include "clustervision.labels" . | nindent 4 }}
stringData:
  admin-password: {{ $auth.adminPassword.value | quote }}
{{- end }}
