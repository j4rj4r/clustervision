apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clustervision.fullname" . }}-backend
  namespace: {{ include "clustervision.namespace" . }}
  labels:
    {{- include "clustervision.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clustervision.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clustervision.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "clustervision.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "clustervision.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.backend.env.clusterName | quote }}
            - name: CLUSTER_API_URL
              value: {{ .Values.backend.env.clusterApiUrl | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.env.corsOrigins | toJson | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.backend.env.publicUrl | quote }}
            {{- if not (or .Values.backend.env.database.url .Values.backend.env.database.existingSecret) }}
            {{- fail "backend.env.database.url or backend.env.database.existingSecret is required — ClusterVision needs a PostgreSQL database" }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.env.database.existingSecret | default (printf "%s-database" (include "clustervision.fullname" .)) }}
                  key: {{ .Values.backend.env.database.existingSecretKey }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CV_SECURE_COOKIE
              value: {{ .Values.backend.env.auth.secureCookie | quote }}
            - name: CV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.env.auth.jwtSecret.existingSecret | default (printf "%s-jwt" (include "clustervision.fullname" .)) }}
                  key: {{ .Values.backend.env.auth.jwtSecret.existingSecretKey }}
            {{- $ap := .Values.backend.env.auth.adminPassword }}
            {{- if or $ap.value $ap.existingSecret }}
            - name: CV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ap.existingSecret | default (printf "%s-admin" (include "clustervision.fullname" .)) }}
                  key: {{ $ap.existingSecretKey }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            {{- if and (not .Values.vault.token) (not .Values.vault.existingSecret) }}
            {{- fail "vault.enabled=true requires vault.token or vault.existingSecret (the pod would fail to start referencing a missing Secret)" }}
            {{- end }}
            - name: VAULT_ENABLED
              value: "true"
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: VAULT_MOUNT
              value: {{ .Values.vault.mount | quote }}
            - name: VAULT_BASE_PATH
              value: {{ .Values.vault.basePath | quote }}
            - name: VAULT_NAMESPACE
              value: {{ .Values.vault.namespace | quote }}
            - name: VAULT_TLS_SKIP_VERIFY
              value: {{ .Values.vault.tlsSkipVerify | default false | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.existingSecret | default (printf "%s-vault" (include "clustervision.fullname" .)) }}
                  key: {{ .Values.vault.existingSecretKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
