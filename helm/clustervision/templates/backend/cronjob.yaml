{{- if .Values.backend.jitCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clustervision.fullname" . }}-jit-cleanup
  namespace: {{ include "clustervision.namespace" . }}
  labels:
    {{- include "clustervision.labels" . | nindent 4 }}
    app.kubernetes.io/component: jit-cleanup
spec:
  schedule: {{ .Values.backend.jitCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "clustervision.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: jit-cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "clustervision.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: jit-cleanup
              image: {{ include "clustervision.backendImage" . }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.jobs.expire_access_bindings"]
              env:
                - name: CLUSTER_NAME
                  value: {{ .Values.backend.env.clusterName | quote }}
                - name: CLUSTER_API_URL
                  value: {{ .Values.backend.env.clusterApiUrl | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.env.database.existingSecret | default (printf "%s-database" (include "clustervision.fullname" .)) }}
                      key: {{ .Values.backend.env.database.existingSecretKey }}
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                {{- toYaml .Values.backend.jitCleanup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
{{- end }}
