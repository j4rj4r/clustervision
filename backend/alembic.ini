[alembic]
script_location = alembic
# sqlalchemy.url is set programmatically in env.py from DATABASE_URL —
# not duplicated here to avoid two sources of truth for the connection string.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
# Same JsonFormatter the app itself uses (app/core/logging_config.py), so
# migration-step log lines share one format with everything else instead
# of reverting to plain text for the one window where Alembic's own
# fileConfig() is in control of the root logger's handler.
class = app.core.logging_config.JsonFormatter
format = %(levelname)-5.5s [%(name)s] %(message)s
